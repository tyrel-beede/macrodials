<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Macro Dials">
  <!-- a dial with four cardinal marks and a needle reading north-east -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#ffffff" stroke-width="4"/>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="9"  x2="32" y2="15"/>
    <line x1="32" y1="49" x2="32" y2="55"/>
    <line x1="9"  y1="32" x2="15" y2="32"/>
    <line x1="49" y1="32" x2="55" y2="32"/>
  </g>
  <line x1="32" y1="32" x2="25" y2="39" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <line x1="32" y1="32" x2="44.5" y2="19.5" stroke="#f2b544" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3.6" fill="#ffffff"/>
</svg>
