site_name: Macro Dials
site_description: Articles, models and the data feed behind the macro-dials dashboard
site_url: https://tyrel-beede.github.io/macrodials/
repo_url: https://github.com/tyrel-beede/macrodials
repo_name: tyrel-beede/macrodials
copyright: Analysis, not advice. Probabilities are the dashboard's or the market's, never a conviction.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    # follows the device setting, with a toggle to override it
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono

plugins:
  - search
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      post_url_format: "{date}/{slug}"
      archive: true
      categories: true
      pagination_per_page: 10

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["docs"]
      check_paths: true

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  model/tables/

nav:
  - Home: index.md
  - Articles: blog/index.md
  - Models:
      - Bull Case 2.0: model/index.md
      - Three sets of numbers: model/three-numbers.md
      - Whose balance sheet: model/balance-sheets.md
  - Forecasts: forecasts/index.md
  - The data feed: data.md
