# .github/workflows/site.yml — build the MkDocs site and publish it to GitHub Pages.
# One-time setting in the repository: Settings → Pages → Source → "GitHub Actions".
name: site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/site_tables.py"
      - ".github/workflows/site.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install "mkdocs-material>=9.7,<10" openpyxl playwright
          python -m playwright install --with-deps chromium
      - name: Export the model's display tables from the workbook (Markdown and PNG)
        run: python tools/site_tables.py
      - name: Build
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
